# ==============================================================================
# 连接别名映射（示例模板，可选）
#
# 用途：让密码表的键与 ssh 别名不同。老配置里密码表用 robot_ai 这类键，
# 而 ssh 别名是 robot-ai，就靠这张表对应。新项目直接用别名做键即可，不需要它。
# ==============================================================================
connections:
  demo_ai: { ssh_host: "demo-ai" }
  demo_mc: { ssh_host: "demo-mc" }
