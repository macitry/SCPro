# ==============================================================================
# 部署配置（示例模板）
#
# 首次运行时会自动复制为 deploy/deploy_config.yaml，后者已被 .gitignore 排除。
# ==============================================================================

# --- 本地源码的基准目录 ---
# projects.yaml 里 local_src 写相对路径时，相对这个目录解析。
#   ~ 与绝对路径都支持；环境变量 DEPLOY_WORKSPACE_ROOT 优先级更高。
#   留空 -> 默认取 app 目录的上一级。
workspace_root: ""

# --- 当前目标 Host（界面顶部下拉框就是在改这一行）---
current_host: "demo-mc"

# --- 部署目录后缀 ---
# 同时作用于「本地打包目录 upload_tmp/<名字><后缀>」与「远端落地目录 <base>/<subdir>/<名字><后缀>>
#   留空   -> 用当天日期，例如 _20260917
#   "-"    -> 不加后缀（直接用 projects.yaml 里的 remote_name）
#   其它值 -> 用该值，缺前导下划线会自动补（wcz -> _wcz）
name_suffix: "-"

# --- 大文件进度 ---
# 单个文件超过这个大小（MB）时，上传过程中在日志里实时打印百分比和网速。
progress_threshold_mb: 10
